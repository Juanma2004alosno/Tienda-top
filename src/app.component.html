
<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <a routerLink="/" class="text-2xl font-bold tracking-tight hover:text-indigo-100 transition">Tienda</a>
      </div>

      <nav class="hidden md:flex items-center space-x-6">
        <a routerLink="/shop" routerLinkActive="text-indigo-200" class="hover:text-indigo-200 font-medium transition">Tienda</a>
        
        @if (authService.currentUser()?.role === 'admin') {
          <a routerLink="/admin" routerLinkActive="text-indigo-200" class="hover:text-indigo-200 font-medium transition">Panel Dueño</a>
        }
      </nav>

      <div class="flex items-center space-x-4">
        <!-- Cart Icon -->
        <a routerLink="/cart" class="relative p-2 hover:bg-indigo-700 rounded-full transition group">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          @if (cartService.count() > 0) {
            <span class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center transform group-hover:scale-110 transition">
              {{ cartService.count() }}
            </span>
          }
        </a>

        <!-- Auth Controls -->
        @if (authService.currentUser()) {
          <div class="flex items-center space-x-3 bg-indigo-700 py-1 px-3 rounded-full">
            <a routerLink="/profile" class="text-sm font-medium hover:text-indigo-200 transition flex items-center space-x-1" title="Ir a mi perfil">
              <span>{{ authService.currentUser()?.username }}</span>
            </a>
            <button (click)="logout()" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-2 py-1 rounded text-white transition">
              Salir
            </button>
          </div>
        } @else {
          <a routerLink="/login" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-bold hover:bg-indigo-50 transition shadow-sm text-sm">
            Iniciar Sesión
          </a>
        }
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-800 text-slate-400 py-8 text-center">
    <p>&copy; Derechos reservados de Juanma.</p>
  </footer>
</div>
